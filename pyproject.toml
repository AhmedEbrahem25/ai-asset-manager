[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-asset-manager"
version = "0.1.0"
description = "Local-first catalog, search and health engine for AI models, datasets and adapters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Asset Manager contributors" }]
keywords = ["ai", "models", "datasets", "huggingface", "gguf", "catalog", "duplicate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Filesystems",
]

# Core runtime. Deliberately excludes torch/transformers/onnx: every format is parsed
# from raw bytes so the catalog can describe models this machine cannot run.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "watchdog>=6.0",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]
# Listing .7z and .rar archives. Everything else -- zip, tar and its compressed forms --
# is read with the standard library, so the scanner is fully functional without these.
archives = ["py7zr>=0.22", "rarfile>=4.2"]
# Only needed to build the standalone executable; see scripts/build_exe.py.
build = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml",
]

[project.scripts]
aam = "ai_asset_manager.cli:main"

[project.urls]
Homepage = "https://github.com/ai-asset-manager/ai-asset-manager"
Documentation = "https://github.com/ai-asset-manager/ai-asset-manager/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["ai_asset_manager"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ai_asset_manager/backend/database/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ANN",  # annotations
    "D",    # pydocstyle
    "RUF",
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is legitimate in the fact-merge layer
    "B008",   # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["ai_asset_manager/backend/database/alembic/"]

[[tool.mypy.overrides]]
# py7zr and rarfile are optional extras: the archive reader imports them inside a
# try/except and degrades to a name-and-size listing when they are absent.
module = ["webview.*", "watchdog.*", "py7zr.*", "rarfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "real_cache: opt-in tests that run against the machine's real HuggingFace/Ollama caches",
    "slow: tests that touch large amounts of synthetic data",
]

[tool.coverage.run]
source = ["ai_asset_manager"]
omit = ["*/alembic/*", "*/desktop.py"]
